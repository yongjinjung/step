# 로컬 개발용 Oracle 21c XE. `docker compose up -d`로 실행한다 (처음 기동은 1~2분, healthy가 되면 접속 가능).
# D:\Docker\oracle\compose.yml과 같은 컨테이너·볼륨을 쓴다(둘 중 하나로만 띄운다).
#   접속: jdbc:oracle:thin:@localhost:1521/XEPDB1, 앱 계정 pharmacy / pharmacy (application-local.yml)
#   관리자: SYS / SYSTEM 비밀번호 oracle
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: pharmacy-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: pharmacy
      APP_USER_PASSWORD: pharmacy
      TZ: Asia/Seoul
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  oracle-data:
    # D:\Docker\oracle 폴더에서 띄웠을 때 만들어진 볼륨 이름. 이름을 고정해 어느 쪽으로 띄워도 같은 데이터를 쓴다.
    name: oracle_oracle-data
