spring:
  application:
    name: dictionary
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      # 엑셀 업로드 파일 최대 크기 (8단계). 넘으면 413 EXCEL_FILE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 10MB

# API 문서 (springdoc)
springdoc:
  # 컨트롤러에 produces를 적지 않은 응답을 */* 대신 application/json으로 문서화한다.
  # 프론트 코드 생성기가 응답을 JSON으로 다루게 하기 위해서다. (엑셀 다운로드는 컨트롤러에서 xlsx로 지정)
  default-produces-media-type: application/json

# 애플리케이션 설정
app:
  # JWT 액세스 토큰 (5단계). 설정 클래스: auth.JwtProperties
  jwt:
    # HS256 서명 비밀키 (UTF-8 32바이트 이상). 기본값이 없어 설정하지 않으면 기동에 실패한다.
    # 운영에서는 환경변수 JWT_SECRET으로 넣는다. local/test 프로파일은 각 파일에 개발용 키가 있다.
    secret: ${JWT_SECRET:}
    # 토큰 유효 시간. 역할 변경/비활성화가 이미 발급된 토큰에 반영되기까지 걸리는 최대 시간이기도 하다.
    expiration: 1h
    # 발급자(iss). 검증 시 이 값과 다른 토큰은 거부한다.
    issuer: dictionary
  # 최초 관리자 (5단계). 사용자 테이블이 비어 있을 때 기동 시 한 번만 만든다. 설정 클래스: user.InitialAdminProperties
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    # 비어 있으면 만들지 않는다. 운영에서는 환경변수 INITIAL_ADMIN_PASSWORD로 넣고 첫 로그인 후 바꾼다.
    password: ${INITIAL_ADMIN_PASSWORD:}
    name: 관리자
