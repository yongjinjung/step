spring:
  application:
    name: dictionary
  profiles:
    default: local
  servlet:
    multipart:
      # 엑셀 업로드 파일 최대 크기 (8단계). 넘으면 413 EXCEL_FILE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    # 공통 마이그레이션 + DB 종류별 마이그레이션({vendor} = mysql, h2). 테이블·컬럼 설명처럼 문법이 DB마다 다른 SQL만
    # db/vendor/{vendor}에 둔다. 버전 번호는 두 경로를 합쳐 겹치지 않아야 한다.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

# MyBatis. SQL은 src/main/resources/mapper/{기능}/XxxMapper.xml, 매퍼 인터페이스는 @Mapper.
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  # Y/N ↔ boolean 변환(YesNoTypeHandler)을 모든 boolean에 기본으로 쓴다.
  type-handlers-package: com.step.dictionary.global.mybatis
  configuration:
    # created_at → createdAt 처럼 컬럼명을 필드명으로 자동 매핑한다.
    map-underscore-to-camel-case: true
    # 세션(트랜잭션) 단위 1차 캐시를 쓰지 않는다. 같은 조회도 매번 DB를 읽어, 서비스가 바꾼 객체가
    # 다른 조회 결과로 다시 나오는 일이 없게 한다.
    local-cache-scope: statement
    # null 파라미터를 JDBC NULL로 보낸다 (MySQL·H2 공통).
    jdbc-type-for-null: "NULL"

# SQL 로그 (P6Spy, spy.properties). 기본은 끈다: 운영·테스트에서는 로그가 너무 많다. local 프로파일에서만 켠다.
decorator:
  datasource:
    enabled: false

# API 문서 (springdoc)
springdoc:
  # 컨트롤러에 produces를 적지 않은 응답을 */* 대신 application/json으로 문서화한다.
  # 프론트 코드 생성기가 응답을 JSON으로 다루게 하기 위해서다. (엑셀 다운로드는 컨트롤러에서 xlsx로 지정)
  default-produces-media-type: application/json

# 애플리케이션 설정
app:
  # JWT 액세스 토큰 (5단계). 설정 클래스: auth.JwtProperties
  jwt:
    # HS256 서명 비밀키 (UTF-8 32바이트 이상). 기본값이 없어 설정하지 않으면 기동에 실패한다.
    # 운영에서는 환경변수 JWT_SECRET으로 넣는다. local/test 프로파일은 각 파일에 개발용 키가 있다.
    secret: ${JWT_SECRET:}
    # 토큰 유효 시간. 역할 변경/비활성화가 이미 발급된 토큰에 반영되기까지 걸리는 최대 시간이기도 하다.
    expiration: 1h
    # 발급자(iss). 검증 시 이 값과 다른 토큰은 거부한다.
    issuer: dictionary
  # 최초 관리자 (5단계). 사용자 테이블이 비어 있을 때 기동 시 한 번만 만든다. 설정 클래스: user.InitialAdminProperties
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    # 비어 있으면 만들지 않는다. 운영에서는 환경변수 INITIAL_ADMIN_PASSWORD로 넣고 첫 로그인 후 바꾼다.
    password: ${INITIAL_ADMIN_PASSWORD:}
    name: 관리자
