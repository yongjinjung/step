# P6Spy 설정 (SQL 로그). 켜고 끄기는 application*.yml의 decorator.datasource.enabled로 한다 (local만 켬).
# 실행된 SQL에 파라미터 값을 채워 넣고, P6SpySqlFormatter가 줄바꿈·들여쓰기해 보여준다.
logMessageFormat=com.step.dictionary.global.logging.P6SpySqlFormatter
# 결과 행(result, resultset)은 너무 많아 남기지 않는다.
excludecategories=info,debug,result,resultset
