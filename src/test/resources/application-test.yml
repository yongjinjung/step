spring:
  datasource:
    url: jdbc:h2:mem:dictionary;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

app:
  jwt:
    # 테스트 전용 키.
    secret: test-only-jwt-secret-for-integration-tests-0123456789
  # initial-admin.password는 두지 않는다. 통합 테스트가 매번 계정을 직접 만들고 테이블을 비우기 때문이다.
